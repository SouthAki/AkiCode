<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Vibe Coding Assistant · 架构画布</title>
    <style>
      :root {
        color-scheme: light;
        --background: #ffffff;
        --foreground: #171719;
        --muted: #6d6d72;
        --line: #e5e5e7;
        --surface: #ffffff;
        --surface-muted: #f5f5f7;
        --canvas-surface: #f7f8fa;
        --glass-surface: rgba(255, 255, 255, .86);
        --accent: #0068d7;
        --accent-hover: #005bbd;
        --accent-foreground: #ffffff;
        --accent-soft: #eaf3ff;
        --ring: rgba(0, 104, 215, .34);
        --brand-shadow: rgba(0, 104, 215, .18);
        --canvas-dot: #d5d7dc;
        --canvas-edge: #c8cbd1;
        --canvas-edge-label: #666b73;
        --node-surface: #ffffff;
        --node-selected: #f4f9ff;
        --node-border: #e2e4e8;
        --node-copy: #62666d;
        --node-shadow: rgba(0, 0, 0, .07);
        --node-shadow-active: rgba(0, 104, 215, .18);
        --success: #248a3d;
        --warning: #936200;
        --error: #c5221f;
        --disabled: #a1a1a6;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { color: var(--foreground); background: var(--background); }
      button, textarea { font: inherit; }
      button { color: inherit; }
      .shell { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 520px; }
      .topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 18px;
        min-height: 68px; padding: 12px 24px; background: var(--glass-surface); border-bottom: 1px solid var(--line);
        backdrop-filter: blur(18px) saturate(120%); -webkit-backdrop-filter: blur(18px) saturate(120%);
      }
      .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
      .brand-icon { display: block; flex: 0 0 36px; width: 36px; height: 36px; object-fit: contain; }
      .brand-title { margin: 0; font-size: clamp(15px, 1.2vw, 17px); font-weight: 600; letter-spacing: -.015em; }
      .toolbar { display: flex; align-items: center; gap: 8px; }
      .tool-button {
        min-width: 36px; height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 11px;
        background: var(--surface); cursor: pointer; transition: background .18s ease, border-color .18s ease, transform .18s ease;
      }
      .tool-button:hover { border-color: var(--accent); background: var(--accent-soft); }
      .tool-button:active, .action:active, .node-choice:active { transform: scale(.98); }
      .tool-button:focus-visible, .node-choice:focus-visible, textarea:focus-visible, .action:focus-visible {
        outline: 3px solid var(--ring); outline-offset: 2px;
      }
      .zoom-label { min-width: 48px; color: var(--muted); text-align: center; font-size: clamp(12px, .9vw, 13px); font-variant-numeric: tabular-nums; }
      .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 330px); flex: 1; min-height: 0; }
      .workspace.is-detail-hidden { grid-template-columns: minmax(0, 1fr); }
      .workspace.is-detail-hidden .detail { display: none; }
      .canvas-wrap { position: relative; min-width: 0; min-height: 0; background-color: var(--canvas-surface); }
      #architecture-canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
      #architecture-canvas.is-panning, #architecture-canvas.is-moving-node { cursor: grabbing; }
      .detail {
        display: flex; flex-direction: column; min-height: 0; padding: 24px 24px 16px;
        background: var(--surface); border-left: 1px solid var(--line); overflow: auto;
      }
      .eyebrow { color: var(--muted); font-size: clamp(11px, .8vw, 12px); font-weight: 600; letter-spacing: .04em; }
      .kind-pill {
        align-self: flex-start; margin-top: 12px; padding: 5px 9px; border-radius: 20px;
        color: var(--accent); background: var(--accent-soft); font-size: clamp(11px, .8vw, 12px); font-weight: 600;
      }
      .detail h2 { margin: 12px 0 8px; font-size: clamp(20px, 2vw, 24px); font-weight: 600; line-height: 1.2; letter-spacing: -.02em; }
      .summary { min-height: 48px; margin: 0; color: var(--muted); font-size: clamp(14px, 1vw, 15px); line-height: 1.5; }
      .path-title { margin: 20px 0 8px; color: var(--foreground); font-size: clamp(12px, .9vw, 13px); font-weight: 600; }
      .paths { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
      .paths li {
        max-width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
        color: var(--muted); background: var(--surface-muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: clamp(10px, .8vw, 11px); overflow-wrap: anywhere;
      }
      .divider { height: 1px; margin: 24px 0 16px; background: var(--line); }
      .prompt-label { margin-bottom: 8px; font-size: clamp(14px, 1vw, 15px); font-weight: 600; }
      #change-request {
        width: 100%; min-height: 120px; padding: 12px; resize: vertical; border: 1px solid var(--line);
        border-radius: 11px; color: var(--foreground); background: var(--surface-muted); font-size: clamp(14px, 1vw, 16px); line-height: 1.5;
      }
      #change-request::placeholder { color: var(--muted); opacity: .78; }
      .actions { display: flex; gap: 8px; margin-top: 12px; }
      .action { min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer; font-size: clamp(13px, .9vw, 14px); font-weight: 600; transition: background .18s ease, border-color .18s ease, transform .18s ease; }
      .action-primary { flex: 1; color: var(--accent-foreground); border-color: var(--accent); background: var(--accent); }
      .action-primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
      .action-primary:disabled { color: var(--disabled); border-color: var(--line); background: var(--surface-muted); cursor: not-allowed; }
      .action-secondary { color: var(--foreground); background: var(--surface); }
      .action-secondary:hover { border-color: var(--accent); background: var(--accent-soft); }
      #request-status { min-height: 30px; margin: 10px 0 0; color: var(--success); font-size: clamp(11px, .85vw, 12px); line-height: 1.45; }
      #request-status[data-tone="warning"] { color: var(--warning); }
      #request-status[data-tone="error"] { color: var(--error); }
      .capability-section { margin-top: auto; padding-top: 16px; }
      .capability-heading { margin: 0 0 8px; color: var(--muted); font-size: clamp(12px, .85vw, 13px); font-weight: 600; }
      .capability-list { display: flex; flex-wrap: wrap; gap: 8px; }
      .node-choice { padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; color: var(--foreground); background: var(--surface); cursor: pointer; font-size: clamp(11px, .85vw, 12px); transition: background .18s ease, border-color .18s ease, transform .18s ease; }
      .node-choice:hover { border-color: var(--accent); background: var(--accent-soft); }
      .node-choice[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
      .footer {
        display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px;
        padding: 8px 24px; border-top: 1px solid var(--line); color: var(--muted); background: var(--surface); font-size: clamp(10px, .8vw, 11px);
      }
      .footer strong { color: var(--foreground); font-weight: 600; }
      .connection { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
      .connection-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--disabled); }
      .connection[data-connected="true"] .connection-dot { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 14%, transparent); }
      @media (max-width: 820px) {
        .workspace { grid-template-columns: minmax(0, 1fr) minmax(260px, 290px); }
        .topbar { padding-inline: 16px; }
        .footer { padding-inline: 16px; }
      }
      @media (max-width: 640px) {
        .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(260px, 44%) minmax(260px, 1fr); }
        .workspace.is-detail-hidden { grid-template-rows: minmax(0, 1fr); }
        .detail { padding: 15px; border-top: 1px solid var(--line); border-left: 0; }
        .toolbar .fit-label { display: none; }
        .detail-toggle-label { display: none; }
        .toolbar { gap: 5px; }
        .tool-button { padding-inline: 8px; }
        .topbar { min-height: 58px; }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --background: #141416;
          --foreground: #f5f5f7;
          --muted: #b1b1b6;
          --line: #343438;
          --surface: #1c1c1e;
          --surface-muted: #242427;
          --canvas-surface: #171719;
          --glass-surface: rgba(28, 28, 30, .88);
          --accent: #4da3ff;
          --accent-hover: #70b4ff;
          --accent-foreground: #08131e;
          --accent-soft: #1d3045;
          --ring: rgba(77, 163, 255, .46);
          --brand-shadow: rgba(77, 163, 255, .2);
          --canvas-dot: #414146;
          --canvas-edge: #55565d;
          --canvas-edge-label: #b7b7bd;
          --node-surface: #242427;
          --node-selected: #202d3a;
          --node-border: #3a3a3f;
          --node-copy: #c1c1c7;
          --node-shadow: rgba(0, 0, 0, .28);
          --node-shadow-active: rgba(77, 163, 255, .2);
          --success: #30d158;
          --warning: #ffb340;
          --error: #ff6961;
          --disabled: #77777c;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <img class="brand-icon" src="/assets/icon.svg" alt="" aria-hidden="true" />
          <h1 class="brand-title">架构画布</h1>
        </div>
        <div class="toolbar" aria-label="画布控制">
          <button class="tool-button" id="zoom-out" type="button" aria-label="缩小">−</button>
          <span class="zoom-label" id="zoom-level">100%</span>
          <button class="tool-button" id="zoom-in" type="button" aria-label="放大">+</button>
          <button class="tool-button" id="toggle-display-mode" type="button" hidden>展开画布</button>
          <button class="tool-button" id="toggle-details" type="button" aria-controls="node-details" aria-expanded="true" aria-label="收起详情侧栏" title="收起详情侧栏">
            <span id="details-toggle-icon" aria-hidden="true">‹</span><span class="detail-toggle-label" id="detail-toggle-label">收起详情</span>
          </button>
          <button class="tool-button" id="fit-canvas" type="button"><span class="fit-label">适应画布</span><span aria-hidden="true">⌗</span></button>
        </div>
      </header>
      <main class="workspace" id="canvas-workspace">
        <section class="canvas-wrap" aria-label="插件模块关系图">
          <canvas id="architecture-canvas" aria-label="可平移、缩放并拖动模块的插件架构图"></canvas>
        </section>
        <aside class="detail" id="node-details" aria-live="polite">
          <span class="eyebrow">当前选择</span>
          <span class="kind-pill" id="node-kind"></span>
          <h2 id="node-title">加载架构…</h2>
          <p class="summary" id="node-summary"></p>
          <p class="path-title">相关文件</p>
          <ul class="paths" id="node-paths"></ul>
          <div class="divider"></div>
          <label class="prompt-label" for="change-request">调整建议</label>
          <textarea id="change-request" maxlength="4000" placeholder="描述希望的变化…"></textarea>
          <div class="actions">
            <button class="action action-primary" id="submit-request" type="button" disabled>发送到对话</button>
            <button class="action action-secondary" id="copy-request" type="button">复制请求</button>
          </div>
          <p id="request-status" role="status" aria-live="polite"></p>
          <div class="capability-section">
            <p class="capability-heading">模块</p>
            <div class="capability-list" id="capability-list"></div>
          </div>
        </aside>
      </main>
      <footer class="footer">
        <span class="footer-tip">拖动模块整理 · 空白处平移 · 滚轮缩放</span>
        <span class="connection" id="connection-state" data-connected="false"><i class="connection-dot"></i><span>连接中…</span></span>
      </footer>
    </div>
    <script id="architecture-data" type="application/json"></script>
    <script type="module" src="./architecture-canvas.js"></script>
  </body>
</html>
